name: Accessibility Scanner (GitHub Pages)

on:
  workflow_dispatch: # Manual trigger
  schedule:
    # Monthly: 1st of each month at 8am UTC (2 hours after main o-hat-pages scan at 6am)
    - cron: '0 8 1 * *'
  workflow_run:
    # Automatically scan after new Pages are deployed
    workflows: ["a11y-scan"]
    types:
      - completed

jobs:
  accessibility_scanner:
    # Only run on success (or manual/scheduled triggers)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: github/accessibility-scanner@v2
        with:
          urls: | # Newline-delimited list of URLs to scan
            https://mgifford.github.io/o-hat-scanner/
            https://mgifford.github.io/o-hat-scanner/trends.html
          repository: mgifford/o-hat-scanner # Repository where issues will be filed
          token: ${{ secrets.GH_TOKEN }} # Must have write access (contents, issues, PRs)
          cache_key: o-hat-scanner-cache_key.txt # Cache filename for incremental results
          # login_url: # Optional: URL of the login page if authentication is required
          # username: # Optional: Username for authentication
          # password: ${{ secrets.PASSWORD }} # Optional: Password for authentication (use secrets!)
          # auth_context: # Optional: Stringified JSON object for complex authentication
          # skip_copilot_assignment: false # Optional: Set to true to skip assigning issues to GitHub Copilot (or if you don't have GitHub Copilot)

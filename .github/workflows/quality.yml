name: Quality Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "*" ]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Generate test report
        run: |
          # Create a test run directory with sample data
          mkdir -p site/runs/test-domain/test-quality-run
          cat > site/runs/test-domain/test-quality-run/results.json <<'EOF'
          {
            "runId": "test-quality-run",
            "startedAt": "2026-01-19T00:00:00Z",
            "finishedAt": "2026-01-19T00:05:00Z",
            "mode": "ci",
            "targets": ["https://example.com"],
            "config": {
              "viewport": "desktop",
              "colorScheme": "light",
              "browser": "chromium",
              "maxPages": 5
            },
            "resultsByUrl": {
              "https://example.com": {
                "title": "Example Page",
                "violations": [
                  {
                    "id": "color-contrast",
                    "impact": "serious",
                    "help": "Elements must meet minimum color contrast ratio thresholds",
                    "helpUrl": "https://dequeuniversity.com/rules/axe/4.10/color-contrast",
                    "nodes": [
                      {
                        "target": [".example"],
                        "html": "<div class=\"example\">Test</div>",
                        "failureSummary": "Fix contrast ratio"
                      }
                    ]
                  }
                ]
              }
            }
          }
          EOF
          
          # Generate the report HTML
          node scripts/generate-report.js

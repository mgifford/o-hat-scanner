<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Page Not Found | O-Hat Scanner</title>
    <style>
        :root { color-scheme: light; --bg:#f5f5f5; --panel:#fff; --border:#e0e0e0; --text:#222; --muted:#666; --link:#1976d2; --accent:#0a2540; }
        * { box-sizing: border-box; }
        body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; background:var(--bg); color:var(--text); }
        a { color: var(--link); text-decoration: underline; }
        a:hover { text-decoration: underline; }
        a:focus { outline: 2px solid var(--link); outline-offset: 2px; }
        .sr-only { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
        header { background: var(--accent); color: #fff; padding: 3rem 1rem; }
        .header-content { max-width: 1200px; margin: 0 auto; }
        .header-content h1 { font-size: 32px; font-weight: 700; margin: 0; color: #fff; }
        main { max-width: 800px; margin: 3rem auto; padding: 0 1rem; }
        .error-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 3rem 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.04); text-align: center; }
        .error-code { font-size: 96px; font-weight: 700; color: var(--muted); margin: 0; line-height: 1; }
        .error-message { font-size: 24px; color: var(--text); margin: 1rem 0 2rem; }
        .error-description { color: var(--muted); line-height: 1.6; margin-bottom: 2rem; }
        .home-link { display: inline-block; padding: 12px 24px; background: var(--accent); color: #fff; border-radius: 4px; font-weight: 600; border: 1px solid var(--accent); text-decoration: underline; }
        .home-link:hover { background: #0b3a82; color: #fff; text-decoration: underline; }
        .home-link:focus { outline: 2px solid var(--link); outline-offset: 3px; text-decoration: underline; }
        footer { text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: 14px; }
        footer a { color: var(--link); text-decoration: underline; }
    </style>
</head>
<body>
    <a class="sr-only" href="#main">Skip to main content</a>
    <header>
        <div class="header-content">
            <h1>🎩 O-Hat Scanner</h1>
        </div>
    </header>
    
    <main id="main">
        <div class="error-panel">
            <h1 class="error-code">404</h1>
            <p class="error-message">Page Not Found</p>
            <p class="error-description">
                The page you're looking for doesn't exist or may have been moved. 
                The scan report you're trying to access might have been archived or removed.
            </p>
            <a href="index.html" class="home-link">← Back to Reports</a>
        </div>
    </main>
    
    <footer>
        <p>
            <a href="https://github.com/mgifford/o-hat-scanner">O-Hat Scanner on GitHub</a>
        </p>
    </footer>
</body>
</html>

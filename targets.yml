  # --- DISCOVERY MODE TARGETS ---
  # Discovery mode runs less frequently (quarterly) to build a stable list of canonical URLs.
  # It uses Bing Web Search API (if BING_API_KEY secret is configured) plus site navigation
  # to find the top N pages, then performs a standard a11y scan on that curated list.
  # Schedule: First day of each quarter at 5am UTC (Jan 1, Apr 1, Jul 1, Oct 1)
  #
  # For each discover-mode target, the workflow will:
  #   1. Run discover-top-pages.js to find candidates
  #   2. Output JSON metadata + newline-delimited URL list to site/targets/
  #   3. Convert to list mode and scan those URLs
  #   4. Publish results to GitHub Pages alongside regular scans

  - name: discover-example-site
    baseUrl: https://www.example.gov
    mode: discover
    maxPages: 100
    schedule:
      - "0 5 1 1,4,7,10 *" # Quarterly: Jan 1, Apr 1, Jul 1, Oct 1 at 5am UTC
    label: discover-example
    notes: "Example discover-mode target. Replace baseUrl with a real gov domain to enable. Uses Tier 1 core 7 default queries."

  # Real site for testing
  - name: discover-civicactions
    baseUrl: https://www.civicactions.com
    mode: discover
    maxPages: 100
    schedule:
      - "0 5 1 1,4,7,10 *" # Quarterly
    label: discover-civicactions
    notes: "Quarterly discovery baseline for CivicActions (uses core 7 default queries)"

